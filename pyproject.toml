[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moire-optics-lab"
version = "2.3.1"
description = "A browser-based bilingual lab for geometric Moiré and sampling aliasing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Vicente Freires dos Santos" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["moire_physics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
